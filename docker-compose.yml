services:
  db: {image: postgres:16-alpine, environment: {POSTGRES_DB: shms, POSTGRES_USER: shms, POSTGRES_PASSWORD: shms}, ports: ["5432:5432"]}
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  minio: {image: minio/minio, command: server /data --console-address ":9001", environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}, ports: ["9000:9000", "9001:9001"]}
  backend: {build: ./backend, env_file: .env, command: gunicorn config.wsgi:application --bind 0.0.0.0:8000, volumes: ["./backend:/app"], depends_on: [db, redis, minio], ports: ["8000:8000"]}
  frontend: {build: ./frontend, environment: {VITE_API_BASE_URL: http://localhost:8000/api/v1}, volumes: ["./frontend:/app", "/app/node_modules"], ports: ["5173:5173"]}
